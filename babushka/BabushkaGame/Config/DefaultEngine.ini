; Low-spec rendering (GDD section 11): the game must run on integrated graphics.
; No Lumen, no Nanite, no virtual shadow maps, DirectX 11 / SM5 for old GPUs.
; The night look comes from a few dynamic lights and grandma's flashlight.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Babushka.BabushkaGameMode
GameDefaultMap=/Game/Babushka/Maps/Dacha.Dacha
EditorStartupMap=/Game/Babushka/Maps/Dacha.Dacha

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX11
+D3D11TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
