# Builds the Android APK of «Последний очаг» and puts it on the Releases page, ready to install on a phone.
# Needs three repository secrets once (hearth/INSTALL.md): UNITY_LICENSE (the .ulf file), UNITY_EMAIL, UNITY_PASSWORD.
# Without them the job only explains what is missing.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'claude/**']
    paths:
      - 'hearth/unity/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Unity license present?
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=APK не собран::Добавьте секреты UNITY_LICENSE, UNITY_EMAIL и UNITY_PASSWORD (hearth/INSTALL.md, шаг 2)"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.license.outputs.ok == 'true'

      # the Unity image for Android is large: make room on the runner
      - uses: jlumbroso/free-disk-space@v1.3.1
        if: steps.license.outputs.ok == 'true'
        with:
          tool-cache: false

      - uses: actions/cache@v4
        if: steps.license.outputs.ok == 'true'
        with:
          path: hearth/unity/LastHearth/Library
          key: Library-Android-${{ hashFiles('hearth/unity/LastHearth/Packages/manifest.json', 'hearth/unity/LastHearth/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - name: Build the APK (Unity 6.3, IL2CPP, ARM64 + ARMv7)
        if: steps.license.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: hearth/unity/LastHearth
          targetPlatform: Android
          buildName: LastHearth
          buildMethod: LastHearth.EditorTools.BuildAndroid.BuildFromCommandLine
          androidExportType: androidPackage
          androidVersionCode: ${{ github.run_number }}
          versioning: None

      - uses: actions/upload-artifact@v4
        if: steps.license.outputs.ok == 'true'
        with:
          name: LastHearth-apk-${{ github.run_number }}
          path: build/Android/*.apk
          if-no-files-found: error

      - name: Put the APK on the Releases page
        if: steps.license.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: «Последний очаг» — сборка ${{ github.run_number }}
          make_latest: true
          files: build/Android/*.apk
          body: |
            Тестовая сборка для Android 7.1 и новее. Откройте эту страницу на телефоне, нажмите LastHearth.apk,
            разрешите установку из браузера и установите. Новая сборка ставится поверх старой, сохранение остаётся.
            Ветка: ${{ github.ref_name }}, коммит ${{ github.sha }}.
